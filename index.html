<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="Live F3 Pace Race Director dashboard for managing real-world race pace in real time." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
  <title>F3 Pace Race Director</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">F3 PACE RACE</p>
        <h1>Race Director</h1>
      </div>
    </header>

    <section class="secondary-watch card">
      <div class="watch-tilt">
        <div class="watch-shadow"></div>
        <div class="watch">
          <div class="watch-glass"></div>
          <div class="watch-face">
            <div class="brand-mark">F3</div>
            <div id="watchTeam" class="team-name">TEAM</div>
            <div id="watchPace" class="pace-display">--:--</div>
            <div class="pace-unit">LEAD PACE</div>
            <div id="watchNeedle" class="needle"><span class="needle-tip"></span></div>
            <div class="hub"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="setupScreen"></section>
    <section id="courseVisualization" class="hidden"></section>
    <section id="dashboardScreen" class="hidden"></section>
    <section id="resultsScreen" class="hidden"></section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
